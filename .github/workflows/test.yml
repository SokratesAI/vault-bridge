name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # This repo is public, so a committed credential is exposed the moment it is
  # pushed. Every other repo in the org that runs CI scans for that; this one
  # did not. Its own job rather than a step inside unit-tests, because the scan
  # needs `fetch-depth: 0` (see below) and nothing else here does.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `gitleaks detect` scans commit history, not the working tree. On the
          # default depth-1 checkout it sees one commit, so it would report clean
          # over a secret sitting anywhere earlier in the branch.
          fetch-depth: 0

      - name: Secret scan
        # gitleaks/gitleaks-action@v2 requires a paid GITLEAKS_LICENSE for org
        # repos as of the "breaking update" in its README — the underlying
        # gitleaks CLI is free/OSS, so run that directly instead of the wrapper.
        # Same version and flags as the GitHubService composition template, so
        # this repo scans the way the templated ones do.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Run unit tests
        run: pytest test_main.py -v

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -sf http://localhost:5984/_up"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats -p 4222:4222 nats:2-alpine -js
          timeout 15 sh -c 'until nc -z localhost 4222; do sleep 0.5; done'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio pytest-timeout

      - name: Wait for CouchDB cluster setup
        run: |
          curl -sf -X POST http://admin:password@localhost:5984/_cluster_setup \
            -H "Content-Type: application/json" \
            -d '{"action":"enable_single_node","username":"admin","password":"password","bind_address":"0.0.0.0","port":5984,"singlenode":true}' \
            || true

      - name: Run e2e tests
        run: pytest tests/e2e/ -v --timeout=30
        env:
          COUCHDB_URL: http://localhost:5984
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: password
          NATS_URL: nats://localhost:4222
          VAULT_REPO: SokratesAI/vault
          CLAUDE_REPO: SokratesAI/.claude
          GITHUB_TOKEN: ghp_test
