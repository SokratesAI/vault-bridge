name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sokratesai/vault-bridge

jobs:
  # Gates the build below. test.yml runs the same scan, but it is a separate
  # workflow with its own trigger and nothing makes this one wait for it -- so
  # without this job a credential that reached main would still be built into
  # an image and pushed to GHCR, where the layer outlives any later fix to the
  # git history. agora and the GitHubService template get this ordering for
  # free by keeping scan and build in one workflow; this repo does not, so the
  # dependency has to be stated.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks detect scans commit history, not the working tree; on the
          # default depth-1 checkout it sees one commit and reports clean.
          fetch-depth: 0

      - name: Secret scan
        # Not `run:` bare -- the default step shell is `bash -e` with no
        # pipefail (confirmed in this repo's own Actions log), so a curl
        # failure in the pipeline below would only be caught by tar happening
        # to fail too. `shell: bash` is `bash -eo pipefail`.
        shell: bash
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact

  build:
    needs: secret-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch manifest update
        uses: ./.github/actions/dispatch-and-watch
        with:
          paths: deployments/vault-bridge/vault-bridge.yaml
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          caller_branch: ${{ github.ref_name }}
          gh_bot_token: ${{ secrets.GH_BOT_TOKEN }}
