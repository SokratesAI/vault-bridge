name: Build and Deploy

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "Dockerfile"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/sokratesai/vault-bridge

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Dispatch manifest update
        uses: ./.github/actions/dispatch-and-watch
        with:
          paths: deployments/vault-bridge/vault-bridge.yaml
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          caller_branch: ${{ github.ref_name }}
          gh_bot_token: ${{ secrets.GH_BOT_TOKEN }}
